# Butterfly 主题配置覆盖文件（根目录优先于主题默认配置）
# 完整可选项见 node_modules/hexo-theme-butterfly/_config.yml（27KB）
# 这里只写需要覆盖的键，升级主题不会丢失

menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  标签: /tags/ || fas fa-tags
  分类: /categories/ || fas fa-folder-open

# Mermaid 图渲染（笔记中的 graph TD 等）
mermaid:
  enable: true
  code_write: true

# 侧边栏作者卡片 Follow 按钮 → 指向真实 GitHub
aside:
  card_author:
    button:
      link: https://github.com/dsjmg1226
